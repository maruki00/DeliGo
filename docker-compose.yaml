# version: "3.8"

services:
  global_broker:
    image: rabbitmq:4-management-alpine
    container_name: global_broker
    restart: 'no'
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      deligo_network:
        ipv4_address: 172.19.0.11


####################################################
#              AIM service                         #
####################################################
  iam_db:
    image: postgres:17-alpine
    container_name: iam_db
    restart: 'always'
    ports:
      - "5432:5432"
    volumes:
      - ./.data/iam/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: iam
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d iam"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      deligo_network:
        ipv4_address: 172.19.0.10
    
  iam_service:
    container_name: iam_service
    restart: "always"
    build:
      context: .
      dockerfile: ./deployments/Dockerfile-iam
    ports:
      - 8081:8081
    networks:
      - deligo_network
    depends_on:
      - iam_db


